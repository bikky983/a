name: NEPSE Data Processing Scheduler

on:
  schedule:
    # Run at 3:10 PM Nepal time (UTC+5:45) which is 9:25 AM UTC
    - cron: '25 9 * * 0-5'  # Sunday to Friday at 9:25 AM UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  process-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Set job timeout to 30 minutes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper git operations
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Updated to Node.js 18
          cache: 'npm'
          
      - name: Install Node.js dependencies
        run: |
          npm install
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create necessary directories
        run: |
          mkdir -p data-scripts
          mkdir -p public
          
      - name: Run NEPSE downloader
        run: |
          echo "Running NEPSE downloader..."
          node nepse_downloader.js
        timeout-minutes: 10  # Set step timeout to 10 minutes
          
      - name: Run Python script
        run: |
          echo "Running Python script..."
          node run_py_script.js --now
        timeout-minutes: 15  # Set step timeout to 15 minutes
          
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NEPSE data [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
