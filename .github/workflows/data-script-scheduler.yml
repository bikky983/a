name: NEPSE Data Processing Scheduler

on:
  schedule:
    # Run at 3:10 PM Nepal time (UTC+5:45) which is 9:25 AM UTC
    - cron: '25 9 * * 0-5'  # Sunday to Friday at 9:25 AM UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  process-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: 'a-main/package-lock.json'
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Python dependencies
        run: |
          cd a-main
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib numpy openpyxl glob2
          
      - name: Install Node.js dependencies
        run: |
          cd a-main
          npm ci
          
      - name: Run data scripts
        run: |
          cd a-main
          # Run the scheduler with the --now flag to execute immediately
          node data-scripts/scheduler.js --now 