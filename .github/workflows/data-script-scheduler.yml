name: NEPSE Data Processing Scheduler

on:
  schedule:
    # Run at 3:10 PM Nepal time (UTC+5:45) which is 9:25 AM UTC
    - cron: '25 9 * * 0-5'  # Sunday to Friday at 9:25 AM UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  process-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: List directory contents
        run: |
          echo "Checking repository structure:"
          ls -la
          echo "Content of data-scripts folder:"
          ls -la data-scripts || echo "data-scripts folder not found"
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          
      - name: Debug package.json
        run: |
          echo "Contents of package.json:"
          cat package.json || echo "package.json not found"
          
      - name: Install Node.js dependencies
        run: |
          echo "Installing npm dependencies..."
          npm install --verbose
          npm install puppeteer
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib numpy openpyxl glob2
          
      - name: Run data scripts
        run: |
          echo "Running data scripts..."
          # Run the scheduler with the --now flag to execute immediately
          node data-scripts/scheduler.js --now 
