name: NEPSE Data Processing Scheduler

on:
  schedule:
    # Run at 3:10 PM Nepal time (UTC+5:45) which is 9:25 AM UTC
    - cron: '25 9 * * 0-5'  # Sunday to Friday at 9:25 AM UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  process-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Set job timeout to 30 minutes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          
      - name: Install Node.js dependencies
        run: |
          npm install
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run NEPSE downloader
        run: |
          echo "Running NEPSE downloader..."
          node data-scripts/nepse_downloader.js --now
        timeout-minutes: 10  # Set step timeout to 10 minutes
          
      - name: Run Python script
        run: |
          echo "Running Python script..."
          node data-scripts/run_py_script.js --now
        timeout-minutes: 15  # Set step timeout to 15 minutes
          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data-scripts/*.csv public/organized_nepse_data.json
          git commit -m "Update NEPSE data [skip ci]" || echo "No changes to commit"
          git push 
