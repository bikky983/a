[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/api/stocks"
  to = "/.netlify/functions/getStocks"
  status = 200

[[redirects]]
  from = "/api/prices"
  to = "/.netlify/functions/getPrices"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"
